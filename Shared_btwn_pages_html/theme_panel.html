<!-- Theme Panel -->
<div id="theme-panel">

    <div class="theme-panel-header">
        <span class="rgb-glow">Themes</span>
    </div>

    <button class="theme-option" data-theme="classic">
        <div class="wallpaper-preview classic-wallpaper-preview"></div>
        <div class="mouse-preview classic-mouse-preview"></div>
        <div>
            <strong>Classic</strong> 
        </div>
    </button>

    <button class="theme-option" data-theme="winter">
        <div class="wallpaper-preview winter-wallpaper-preview"></div>
        <div class="mouse-preview winter-mouse-preview"></div>
        <div>
            <strong>Winter</strong> 
        </div>
    </button>

    <button class="theme-option" data-theme="fortnite">
        <div class="wallpaper-preview fortnite-wallpaper-preview"></div>
        <div class="mouse-preview fortnite-mouse-preview"></div>
        <div>
            <strong>Fortnite</strong> 
        </div>
    </button>

    <button class="theme-option" data-theme="halo">
        <div class="wallpaper-preview halo-wallpaper-preview"></div>
        <div class="mouse-preview halo-mouse-preview"></div>
        <div>
            <strong>Halo</strong> 
        </div>
    </button>

    <button class="theme-option" data-theme="minecraft">
        <div class="wallpaper-preview minecraft-wallpaper-preview"></div>
        <div class="mouse-preview minecraft-mouse-preview"></div>
        <div>
            <strong>Minecraft</strong> 
        </div>
    </button>

    



</div>
