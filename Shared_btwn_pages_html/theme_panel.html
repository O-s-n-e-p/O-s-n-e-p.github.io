<!-- Theme Panel -->
<div id="theme-panel">

    <div class="theme-panel-header">
        <span class="rgb-glow">Themes</span>
    </div>

    <button class="theme-option" data-theme="classic">
        <div>
            <strong>Classic</strong> 
        </div>
        <div class="wallpaper-preview classic-wallpaper-preview"></div>
        <div class="mouse-preview classic-mouse-preview"></div>
    </button>

    <button class="theme-option" data-theme="winter">
        <div>
            <strong>Winter</strong> 
        </div>
        <div class="wallpaper-preview winter-wallpaper-preview"></div>
        <div class="mouse-preview winter-mouse-preview"></div>
    </button>

    <button class="theme-option" data-theme="vista">
        <div>
            <strong>Windows Vista</strong> 
        </div>
        <div class="wallpaper-preview vista-wallpaper-preview"></div>
        <div class="mouse-preview vista-mouse-preview"></div>
    </button>

    



</div>
